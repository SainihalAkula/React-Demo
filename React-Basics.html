<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>ChatBot</title>
	</head>
	<body>
		<div class="js-container"></div>

		<script src="https://unpkg.com/supersimpledev/react.js"></script>
		<script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

		<script src="https://unpkg.com/supersimpledev/babel.js"></script>
		<script src="https://unpkg.com/supersimpledev@8.6.4/dayjs.js"></script>
		<script type="text/babel">
			function Chatbox() {
				return (
					<div>
						<input placeholder="Enter your request" width="50" />
						<button>Send</button>
					</div>
				);
			}
			function ChatMessage({ message, sender }) {
				return (
					<div>
						{sender === 'bot' && <img src="robot.png" width="50" />}
						{message}
						{sender === 'User' && <img src="user.png" width="50" />}
					</div>
				);
			}
			function ChatMessages(params) {
				const chatMessages = [
					{ message: 'Hi ChatBot', sender: 'User', key: 'id1' },
					{ message: 'Hi you need help?', sender: 'bot', key: 'id2' },
					{
						message: 'Can you tell me what is the date today',
						sender: 'User',
						key: 'id3',
					},
					{
						message: "Today's date is September 27",
						sender: 'bot',
						key: 'id4',
					},
					{
						message: 'That is all i wanted to Know',
						sender: 'User',
						key: 'id5',
					},
					{ message: 'You are welcome', sender: 'bot', key: 'id6' },
				];
				return (
					<>
						{chatMessages.map((chatMessage) => {
							return (
								<ChatMessage
									message={chatMessage.message}
									sender={chatMessage.sender}
									key={chatMessage.key}
								/>
							);
						})}
					</>
				);
			}
			function App( params) {
				return (
					<>
						<Chatbox />
						<ChatMessages />
					</>
				);
			}

			const container = document.querySelector('.js-container');
			ReactDOM.createRoot(container).render(<App />);
		</script>
	</body>
</html>
